<!-- @dsCard group="Colors" viewport="700x150" name="Semantic status" subtitle="On-track · attention · alert · neutral" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-card);font-family:var(--font-body);display:flex;height:150px}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:12px}.n{font-family:var(--font-mono);font-size:11px;font-weight:500}.h{font-family:var(--font-mono);font-size:10px;opacity:.8}.lt{color:#fff}</style></head>
<body>
<div class="sw lt" style="background:var(--status-healthy)"><div class="n">On-track</div><div class="h">#2E9E7B</div></div>
<div class="sw lt" style="background:var(--status-attention)"><div class="n">Attention</div><div class="h">#C77D3A</div></div>
<div class="sw lt" style="background:var(--status-alert)"><div class="n">Alert</div><div class="h">#C24A3A</div></div>
<div class="sw lt" style="background:var(--status-neutral)"><div class="n">Neutral</div><div class="h">#6C7680</div></div>
</body></html>
