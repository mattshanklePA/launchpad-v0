<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="Chalk canvas · limestone fields · basalt ink ramp" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-card);font-family:var(--font-body);display:flex;height:150px}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;border-right:1px solid rgba(0,0,0,.06)}.n{font-family:var(--font-mono);font-size:11px;font-weight:500}.h{font-family:var(--font-mono);font-size:10px;opacity:.65}.lt{color:var(--ks-white)}.dk{color:var(--ks-basalt)}</style></head>
<body>
<div class="sw dk" style="background:var(--ks-white)"><div class="n">White</div><div class="h">#FFFFFF</div></div>
<div class="sw dk" style="background:var(--ks-chalk)"><div class="n">Chalk</div><div class="h">#F4F2EC</div></div>
<div class="sw dk" style="background:var(--ks-limestone)"><div class="n">Limestone</div><div class="h">#E7E1D6</div></div>
<div class="sw lt" style="background:var(--ks-ink-500)"><div class="n">Ink 500</div><div class="h">#6C7680</div></div>
<div class="sw lt" style="background:var(--ks-ink-700)"><div class="n">Ink 700</div><div class="h">#4A545E</div></div>
</body></html>
