# Single-package project (not a monorepo). pnpm requires a `packages` field
# whenever this file exists; "." registers the repo root as the only package.
packages:
  - "."

allowBuilds:
  core-js: true
  esbuild: true
  unrs-resolver: set this to true or false

# pnpm 10+ blocks dependency build scripts by default. Approve the ones this
# app needs so `pnpm install` doesn't fail with ERR_PNPM_IGNORED_BUILDS.
onlyBuiltDependencies:
  - core-js
  - esbuild
