# Single-package project (not a monorepo). pnpm requires a `packages` field
# whenever this file exists; "." registers the repo root as the only package.
packages:
  - "."

# pnpm 10+ blocks dependency build scripts by default and CI treats an
# unapproved build as a hard error. Approve the ones present in the tree.
allowBuilds:
  core-js: true
  esbuild: true
  unrs-resolver: true

onlyBuiltDependencies:
  - core-js
  - esbuild
  - unrs-resolver
