name: CI

# Run on PRs (feature branches) and on push to the canonical branches only.
# Running on every branch push AND on pull_request caused two competing CI runs
# per PR (one could hang and block auto-merge). PRs are covered by pull_request;
# doc is covered on push after merge. `redesign` is the long-lived base used by
# issues labelled `base:redesign`, and is listed here so a merge into it runs
# CI on the branch push — the event queue.yml listens for.
on:
  push:
    branches: [doc, redesign]
  pull_request:

# Cancel an in-progress run when a newer commit arrives on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # CI sets CI=true, which makes pnpm default to --frozen-lockfile. Override
      # for now so a slightly-out-of-sync lockfile doesn't fail install. Tighten
      # to --frozen-lockfile once the lockfile is known-good and committed.
      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Dummy build-time envs so `next build` doesn't fail on missing public
          # vars in CI. Real values are set per-project in Vercel at deploy.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-key
          ANTHROPIC_API_KEY: dummy-anthropic-key
          NEXT_PUBLIC_TENANT: uspto
