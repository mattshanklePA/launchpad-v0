name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Not --frozen-lockfile yet: the lockfile needs `pnpm install` run locally
      # once to pick up vitest/jsdom. Switch to --frozen-lockfile after that.
      - name: Install
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Dummy build-time envs so `next build` doesn't fail on missing public
          # vars in CI. Real values are set per-project in Vercel at deploy.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-key
          ANTHROPIC_API_KEY: dummy-anthropic-key
          NEXT_PUBLIC_TENANT: uspto
