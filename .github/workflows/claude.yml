name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Give Claude the same toolchain CI uses (mirrors ci.yml) so it can run
      # pnpm typecheck / lint / test on its own work before pushing, instead of
      # shipping unverified code and failing CI.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # Dummy build-time envs (mirrors ci.yml) so the agent can run
          # `pnpm build` to self-check, catching build-only breaks BEFORE the PR
          # instead of failing CI (e.g. a component missing "use client").
          # ANTHROPIC_API_KEY is deliberately omitted so it can't shadow the
          # action's OAuth auth (claude_code_oauth_token below).
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-key
          NEXT_PUBLIC_TENANT: uspto
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Pre-approve the verification commands so Claude can self-check in a
          # headless run (no interactive approval is possible in CI). Includes
          # `pnpm build` so the agent verifies the production build, not just
          # typecheck/lint/test — the gap that let CC-STYLE fail CI.
          claude_args: '--allowed-tools "Bash(pnpm typecheck),Bash(pnpm lint),Bash(pnpm test),Bash(pnpm build),Bash(pnpm install*)"'
